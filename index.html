<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <title>Inicio</title>
<style>
  body {
  margin: 0;
  padding: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
#map {
  flex: 1;
}
#header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: green;
  padding: 10px 20px;
  color: white;
}
.menu{
  display: flex;
  align-items:center;
  gap: 15px;
}
.menu a{
  color: #00FF00;
  text-decoration: none;
}
.menu a:hover{
  color: white;
}
.menu h1{
    margin:0px;
}       
</style>
</head>
<body>
    <div id="header">
        <div class="menu">
        <h1>General Rodríguez</h1> 
        <a href="partido.html">Sobre el partido</a>
        <a href="pagina.html">Sobre esta página</a>
        <a href="fuentes.html">Fuentes y Recursos</a>
        </div>
    </div>
    <div id="map"></div>
    <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
    </script>
    
<script>
  var map = L.map('map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

fetch('partido.geojson')
.then(response => response.json())
.then(data => {
const partido = L.geoJSON(data).addTo(map);
map.fitBounds(partido.getBounds());
});

function lugar(lat, lng, nombre, link) {
const marcador = L.marker([lat, lng]).addTo(map);

marcador.bindTooltip(nombre, {
direction: "top",
offset: [0, -10]
});

marcador.on("click", () => {
window.location.href = link;
});
  }

  lugar(-34.606082, -58.952004, "Iglesia Nuestra Señora del Carmen", "iglesiaNSC.html");
  lugar(-34.606416, -58.949729, "Escuela N°1", "escuela1.html");
  lugar(-34.622526, -58.948667, "Hospital Vicente Lopez y Planes", "vicentelopez.html");
  lugar(-34.615191, -58.957639, "EEST N°1 Javier Tapie", "tapie.html");
  lugar(-34.71463, -59.05626, "Hospital Nacional Dr. Baldomero Sommer", "sommer.html");
  lugar(-34.669103, -58.951832, "La Choza", "choza.html");
  lugar(-34.608810, -58.948253, "Torres Eiffel Et. Cie.", "torreseiffel.html");
</script>
</body>
</html>
