<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <title>Inicio</title>
    <style>
  body{
    background-color:#FFFFFF;
  }
  
  #map{
    height:800px;
    }

  #header{
    color:#FFFFFF;
    background-color:green;
    padding:10px;
    margin:0px;
  }
</style>
</head>
<body>
    <div id="header"><h1>General Rodríguez</h1></div>
    <div id="map"></div>
    <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
    </script>
    
    <script>
    var map=L.map('map').setView([-34.61, -58.96], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'}).addTo(map);
        
    const lugar=L.marker([-34.606082, -58.952004]).addTo(map);
    lugar.bindTooltip("Iglesia Nuestra Señora del Carmen");
    lugar.on("click", () => {window.location.href = "iglesiaNSC.html";}
    ); 

    const lugar=L.marker([-34.606416, -58.949729]).addTo(map);
    lugar.bindTooltip("Escuela N°1");
    lugar.on("click", () => {window.location.href = "escuela1.html";}
    ); 

    const lugar=L.marker([-34.622526, -58.948667]).addTo(map);
    lugar.bindTooltip("Hospital Vicente Lopez y Planes");
    lugar.on("click", () => {window.location.href = "vicentelopez.html";}
    ); 
</script>
</body>
</html>
